{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{% endblock %}</title>

  {# Fonts: Inter for body text, Inter Tight for headings. Only the weights we use. #}
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@600&display=swap">

  <link rel="stylesheet" href="{% static 'css/site.css' %}">
</head>
<body class="min-h-screen bg-[#F7F7F5] font-sans text-[#111111] antialiased">
  {% block content %}{% endblock %}
</body>
</html>
