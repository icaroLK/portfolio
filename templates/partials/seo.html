{# Rendered by {% seo_tags %} (portfolio/templatetags/seo.py). #}
<title>{{ title }}</title>
{% if description %}<meta name="description" content="{{ description }}">{% endif %}
{% if noindex %}<meta name="robots" content="noindex">{% else %}<link rel="canonical" href="{{ canonical_url }}">{% endif %}

<meta property="og:type" content="{{ og_type }}">
<meta property="og:site_name" content="{{ site_name }}">
<meta property="og:title" content="{{ title }}">
{% if description %}<meta property="og:description" content="{{ description }}">{% endif %}
<meta property="og:url" content="{{ canonical_url }}">
{% if image_url %}
<meta property="og:image" content="{{ image_url }}">
{% if image.width %}<meta property="og:image:width" content="{{ image.width }}">
<meta property="og:image:height" content="{{ image.height }}">{% endif %}
<meta property="og:image:alt" content="{{ image_alt }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ image_url }}">
{% else %}
<meta name="twitter:card" content="summary">
{% endif %}
<meta name="twitter:title" content="{{ title }}">
{% if description %}<meta name="twitter:description" content="{{ description }}">{% endif %}
